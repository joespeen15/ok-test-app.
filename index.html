```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Диагностика OK API</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 330px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            background: #f2f3f5;
            border-radius: 10px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Диагностика</h1>

    <button onclick="checkEnvironment()">
        Проверить окружение
    </button>

    <button onclick="checkInitSupport()">
        Проверить VKWebAppInit
    </button>

    <div id="result">
        Готово к проверке.
    </div>

</div>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<script>

    function checkEnvironment() {

        const result = document.getElementById("result");

        if (typeof vkBridge === "undefined") {
            result.textContent =
                "VK Bridge НЕ найден.";
            return;
        }

        let text = "";

        text += "VK Bridge: найден\n";
        text += "Тип: " + typeof vkBridge + "\n\n";

        try {
            text += "isWebView: " +
                vkBridge.isWebView() + "\n";

            text += "isIframe: " +
                vkBridge.isIframe() + "\n";

            text += "isEmbedded: " +
                vkBridge.isEmbedded() + "\n";

            text += "isStandalone: " +
                vkBridge.isStandalone() + "\n";

        } catch (error) {

            text +=
                "Ошибка определения окружения:\n" +
                JSON.stringify(error);

        }

        text += "\nURL:\n";
        text += window.location.href;

        result.textContent = text;
    }


    function checkInitSupport() {

        const result = document.getElementById("result");

        if (typeof vkBridge === "undefined") {
            result.textContent =
                "VK Bridge НЕ найден.";
            return;
        }

        try {

            const supported =
                vkBridge.supports("VKWebAppInit");

            result.textContent =
                "VKWebAppInit поддерживается: " +
                supported;

        } catch (error) {

            result.textContent =
                "Ошибка:\n" +
                JSON.stringify(error);

        }
    }

</script>

</body>
</html>

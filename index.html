<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тест OK API</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #555;
            word-break: break-word;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            background: #f2f3f5;
            border-radius: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Тест OK API</h1>

    <p id="status">
        Приложение загружено.
    </p>

    <button onclick="initVK()">
        Инициализировать VK Bridge
    </button>

    <div id="result"></div>

</div>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<script>

    async function initVK() {

        const status = document.getElementById("status");
        const result = document.getElementById("result");

        status.textContent = "Инициализация...";
        result.textContent = "";

        if (typeof vkBridge === "undefined") {

            status.textContent = "Ошибка";

            result.textContent =
                "VK Bridge не найден.";

            return;
        }

        result.textContent =
            "VK Bridge найден.\n" +
            "Отправляем VKWebAppInit...\n";

        try {

            const timeout = new Promise((_, reject) => {

                setTimeout(() => {

                    reject(
                        new Error(
                            "VKWebAppInit не ответил за 10 секунд."
                        )
                    );

                }, 10000);

            });

            const initRequest = vkBridge.send("VKWebAppInit");

            const response = await Promise.race([
                initRequest,
                timeout
            ]);

            status.textContent =
                "VK Bridge успешно инициализирован!";

            result.textContent +=
                "\nОтвет:\n" +
                JSON.stringify(response, null, 2);

            console.log(
                "VKWebAppInit response:",
                response
            );

        } catch (error) {

            status.textContent =
                "Ошибка инициализации";

            result.textContent +=
                "\nОшибка:\n" +
                JSON.stringify(error, null, 2);

            console.error(
                "VKWebAppInit error:",
                error
            );
        }
    }

</script>

</body>
</html>

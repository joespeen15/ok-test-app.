<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Диагностика OK API</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #555;
            word-break: break-word;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            background: #f2f3f5;
            border-radius: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Диагностика</h1>

    <p id="status">
        Страница загружена.
    </p>

    <button onclick="checkBridge()">
        Проверить VK Bridge
    </button>

    <button onclick="checkEnvironment()">
        Проверить окружение
    </button>

    <div id="result"></div>

</div>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<script>

    function checkBridge() {

        const result = document.getElementById("result");

        result.textContent = "Начинаем проверку...\n";

        if (typeof vkBridge === "undefined") {

            result.textContent +=
                "VK Bridge НЕ найден.";

            return;
        }

        result.textContent +=
            "VK Bridge найден.\n";

        result.textContent +=
            "Тип: " + typeof vkBridge + "\n";

        result.textContent +=
            "Метод send: " + typeof vkBridge.send + "\n";

        result.textContent +=
            "Проверка завершена.";

    }


    function checkEnvironment() {

        const result = document.getElementById("result");

        result.textContent =
            "URL:\n" +
            window.location.href +
            "\n\nUser Agent:\n" +
            navigator.userAgent +
            "\n\nVK Bridge:\n" +
            (typeof vkBridge === "undefined"
                ? "НЕ найден"
                : "найден");

    }

</script>

</body>
</html>

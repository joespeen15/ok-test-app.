<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест OK API</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 300px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Тест OK API</h1>
        <p id="status">Приложение успешно загрузилось.</p>
        <button onclick="test()">Проверить</button>
    </div>

    <script>
        function test() {
            document.getElementById("status").textContent =
                "JavaScript работает!";
        }
    </script>
</body>
</html>
